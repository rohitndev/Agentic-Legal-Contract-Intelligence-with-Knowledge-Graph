# Local orchestration: API + optional Neo4j + optional Redis (Celery broker).
# `docker compose -f deployment/docker-compose.yml up --build` brings up the API;
# Neo4j and Redis are included so you can exercise the production backends locally.
services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # Point the API at the bundled Neo4j / Redis services (comment out for offline mode).
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - neo4j
      - redis

  worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: celery -A api.tasks.celery_app worker --loglevel=info
    env_file:
      - ../.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
    depends_on:
      - redis
      - neo4j

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/testpassword
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  neo4j_data:
